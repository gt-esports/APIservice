services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Generate a disposable integration database password}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      database:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:8080/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${INTEGRATION_DB_PASSWORD:?Generate a disposable integration database password}@database:5432/postgres?search_path=auth
      DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${INTEGRATION_JWT_SECRET:?Generate a disposable integration JWT secret}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: error
    networks: [integration]

  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${INTEGRATION_DB_PASSWORD:?Generate a disposable integration database password}@database:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "2"
      PGRST_JWT_SECRET: ${INTEGRATION_JWT_SECRET:?Generate a disposable integration JWT secret}
      PGRST_JWT_AUD: authenticated
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: error
    networks: [integration]

  proxy:
    image: nginx:1.28-alpine
    depends_on: [auth, rest]
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Docker does not publish host ports for containers on internal-only networks.
    # Only this fixed-upstream proxy joins the ingress bridge; data services do not.
    networks: [integration, ingress]

networks:
  integration:
    internal: true
  ingress:
